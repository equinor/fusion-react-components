<!-- Temporary Storybook policy following EDS colour scheme detection:
     https://eds.equinor.com/docs/foundation/colour/getting_started#colour-scheme-detection
     The HTML parser merges these attributes onto the document's root <html> element. -->
<html data-color-scheme="light">
<!-- Page background and text colours follow the EDS colour scheme (data-color-scheme on <html>). -->
<style>
  body {
    background-color: var(--eds-color-bg-neutral-surface);
    color: var(--eds-color-text-neutral-strong);
  }
</style>
